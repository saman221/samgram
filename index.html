<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سام‌گرام</title>
  <style>
    body { font-family: sans-serif; direction: rtl; background: #f9f9f9; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: auto; padding: 20px; position: relative; }
    .title { text-align: center; font-size: 24px; margin-bottom: 20px; }
    .post, .story { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
    .post img, .story img { width: 100%; border-radius: 10px; margin: 10px 0; }
    input, textarea { width: 100%; margin: 8px 0; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .likes { color: #e60023; cursor: pointer; }
    .stories-container { display: flex; overflow-x: auto; gap: 10px; margin-top: 80px; margin-bottom: 20px; }
    .story { flex: 0 0 auto; width: 120px; text-align: center; }
    .story img { height: 120px; object-fit: cover; }
    .plus-button {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 36px;
      background: #007bff;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
    }
    .modal { display: none; position: fixed; top: 0; right: 0; left: 0; bottom: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
    .close-btn { float: left; cursor: pointer; font-size: 18px; margin-bottom: 10px; color: #777; }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">📸 سام‌گرام</div>

    <div class="plus-button" onclick="openModal()">+</div>

    <div class="stories-container" id="stories"></div>

    <div id="posts"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">✖</span>
      <label>آپلود عکس پست:</label>
      <input type="file" id="postFile">
      <textarea id="caption" placeholder="توضیح پست..."></textarea>
      <button onclick="handleAddPost()">ارسال پست</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDU2p9M9DTk_P65zcewbD_-HkeC0Xw-DL4",
      authDomain: "samgram231.firebaseapp.com",
      projectId: "samgram231",
      storageBucket: "samgram231.firebasestorage.app",
      messagingSenderId: "714690930267",
      appId: "1:714690930267:web:6958eeba8f5f996022c17e",
      measurementId: "G-Y85SDY6X78"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const postsContainer = document.getElementById("posts");

    async function renderPosts() {
      postsContainer.innerHTML = "در حال بارگذاری...";
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      const querySnapshot = await getDocs(q);
      postsContainer.innerHTML = "";
      querySnapshot.forEach((doc) => {
        const post = doc.data();
        postsContainer.innerHTML += `
          <div class="post">
            <strong>@${post.username}</strong>
            <img src="${post.image}" alt="post image">
            <p>${post.caption}</p>
            <p class="likes">❤️ ${post.likes || 0} لایک</p>
          </div>
        `;
      });
    }

    async function addPostToFirestore(imageDataURL, caption) {
      await addDoc(collection(db, "posts"), {
        username: "کاربر", // می‌تونی بعداً با نام واقعی جایگزین کنی
        image: imageDataURL,
        caption,
        likes: 0,
        createdAt: new Date()
      });
      renderPosts();
      closeModal();
    }

    function handleAddPost() {
      const fileInput = document.getElementById("postFile");
      const caption = document.getElementById("caption").value;
      if (!fileInput.files[0] || !caption) return alert("لطفاً عکس و توضیح را وارد کنید.");

      const reader = new FileReader();
      reader.onload = function(e) {
        const image = e.target.result;
        addPostToFirestore(image, caption);
      };
      reader.readAsDataURL(fileInput.files[0]);

      fileInput.value = "";
      document.getElementById("caption").value = "";
    }

    function openModal() {
      document.getElementById('uploadModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('uploadModal').style.display = 'none';
    }

    renderPosts();
  </script>
</body>
</html>
