<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به سام‌گرام</title>
  <style>
    body { font-family: sans-serif; direction: rtl; margin: 0; padding: 0; background: #f0f0f0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
    h2 { text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .toggle { text-align: center; margin-top: 15px; color: #007bff; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2 id="formTitle">ورود به سام‌گرام</h2>
    <input type="text" id="username" placeholder="نام کاربری">
    <input type="password" id="password" placeholder="رمز عبور">
    <button onclick="handleAuth()" id="authBtn">ورود</button>
    <div class="toggle" onclick="toggleMode()" id="toggleText">ثبت‌نام ندارید؟ ایجاد حساب</div>
  </div>
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries
  
    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyDU2p9M9DTk_P65zcewbD_-HkeC0Xw-DL4",
      authDomain: "samgram231.firebaseapp.com",
      projectId: "samgram231",
      storageBucket: "samgram231.firebasestorage.app",
      messagingSenderId: "714690930267",
      appId: "1:714690930267:web:6958eeba8f5f996022c17e",
      measurementId: "G-Y85SDY6X78"
    };
  
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>
  <script>
    let isLogin = true;

    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById('formTitle').innerText = isLogin ? 'ورود به سام‌گرام' : 'ثبت‌نام در سام‌گرام';
      document.getElementById('authBtn').innerText = isLogin ? 'ورود' : 'ثبت‌نام';
      document.getElementById('toggleText').innerText = isLogin ? 'ثبت‌نام ندارید؟ ایجاد حساب' : 'حساب دارید؟ ورود';
    }

    function handleAuth() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) return alert('نام کاربری و رمز عبور را وارد کنید');

      const users = JSON.parse(localStorage.getItem('users') || '{}');

      if (isLogin) {
        if (!users[username] || users[username] !== password) {
          alert('نام کاربری یا رمز عبور نادرست است');
          return;
        }
      } else {
        if (users[username]) {
          alert('این نام کاربری قبلاً ثبت شده است');
          return;
        }
        users[username] = password;
        localStorage.setItem('users', JSON.stringify(users));
      }

      localStorage.setItem('currentUser', username);
      window.location.href = 'index.html';
    }

  </script>
</body>
</html>
