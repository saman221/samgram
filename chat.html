<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چت خصوصی</title>
  <style>
    body { font-family: sans-serif; direction: rtl; margin: 0; padding: 0; background: #f5f5f5; }
    .chat-container { display: flex; height: calc(100vh - 60px); }
    .contacts { width: 35%; background: #fff; border-left: 1px solid #ccc; overflow-y: auto; }
    .contacts h3 { padding: 10px; margin: 0; background: #eee; border-bottom: 1px solid #ccc; }
    .contacts ul { list-style: none; padding: 0; margin: 0; }
    .contacts li { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
    .contacts li:hover { background: #f0f0f0; }
    .chat { flex: 1; display: flex; flex-direction: column; padding: 10px; }
    .messages { flex: 1; overflow-y: auto; background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .message { margin: 5px 0; padding: 8px 12px; border-radius: 12px; background: #dff0ff; max-width: 70%; }
    .input-box { display: flex; }
    .input-box input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    .input-box button { margin-right: 10px; padding: 10px 15px; border: none; border-radius: 8px; background: #007bff; color: white; cursor: pointer; }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    .bottom-nav a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="contacts">
      <h3>مخاطبین</h3>
      <ul id="contactList"></ul>
    </div>
    <div class="chat">
      <div class="messages" id="messages"></div>
      <div class="input-box">
        <input type="text" id="messageInput" placeholder="پیام...">
        <button onclick="sendMessage()">ارسال</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html">خانه</a>
    <a href="profile.html">پروفایل</a>
    <a href="chat.html">چت خصوصی</a>
  </div>
 <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries
  
    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyDU2p9M9DTk_P65zcewbD_-HkeC0Xw-DL4",
      authDomain: "samgram231.firebaseapp.com",
      projectId: "samgram231",
      storageBucket: "samgram231.firebasestorage.app",
      messagingSenderId: "714690930267",
      appId: "1:714690930267:web:6958eeba8f5f996022c17e",
      measurementId: "G-Y85SDY6X78"
    };
  
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>
  <script>
    const currentUser = localStorage.getItem('currentUser') || 'کاربر';
    const users = ['saman7', 'tara_88', 'amir_story'];
    let activeChat = users[0];

    const contactList = document.getElementById('contactList');
    const messagesDiv = document.getElementById('messages');

    function loadContacts() {
      contactList.innerHTML = '';
      users.forEach(user => {
        if (user !== currentUser) {
          const li = document.createElement('li');
          li.textContent = user;
          li.onclick = () => switchChat(user);
          contactList.appendChild(li);
        }
      });
    }

    function switchChat(user) {
      activeChat = user;
      renderMessages();
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const key = `chat_${currentUser}_${activeChat}`;
      const messages = JSON.parse(localStorage.getItem(key)) || [];
      messages.push({ from: currentUser, text });
      localStorage.setItem(key, JSON.stringify(messages));

      input.value = '';
      renderMessages();
    }

    function renderMessages() {
      const key = `chat_${currentUser}_${activeChat}`;
      const messages = JSON.parse(localStorage.getItem(key)) || [];
      messagesDiv.innerHTML = '';
      messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'message';
        div.textContent = `${msg.from === currentUser ? 'شما' : msg.from}: ${msg.text}`;
        messagesDiv.appendChild(div);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    loadContacts();
    renderMessages();
  </script>
</body>
</html>
